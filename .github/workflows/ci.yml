name: CI

# Push covers branches without PRs; pull_request also tests the merge result and
# enables CI for fork PRs. Unfiltered push means tag pushes run too (harmless).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test with Neovim (${{ matrix.neovim-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        neovim-version: [v0.12.0, stable]

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Neovim
        # `version: stable` is resolved dynamically at run time, so the exact
        # Neovim build CI exercises can drift without any change to this file.
        # This commit SHA is pinned deliberately, for auditability, instead of
        # referencing the `v1.6.1` tag: `v1.6.1` is a lightweight tag that
        # resolves straight to this same commit, so a reviewer can verify the
        # pin, and it changes only through an explicit edit.
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: ${{ matrix.neovim-version }}

      - name: Show the resolved Neovim version
        run: nvim --version | head -n 1

      - name: Run the test suite
        run: nvim --headless -l tests/run.lua

      - name: Run real-startup smoke test
        run: tests/live_startup.sh
