name: CI

# `push` only, so one commit produces one workflow run. It stays unfiltered
# (no `branches:`/`tags:`) because a push to a branch that has no PR must still
# trigger a run -- that is how the red-run self-test was performed. What this
# trades away:
#   - Pull requests from forks will not trigger CI at all: a push in a fork
#     does not trigger the upstream repository's workflows.
#   - CI no longer tests the branch merged with the base (`pull_request` ran on
#     `refs/pull/*/merge`), so a branch that is green alone but breaks when
#     combined with `master` is only discovered by the run on `master` after
#     merging.
#   - Unfiltered `push` also means tag pushes trigger CI (harmless, but worth
#     knowing).
on: push

permissions:
  contents: read

jobs:
  test:
    name: Test with Neovim (${{ matrix.neovim-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        neovim-version: [v0.12.0, stable]

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Neovim
        # `version: stable` is resolved dynamically at run time, so the exact
        # Neovim build CI exercises can drift without any change to this file.
        # This commit SHA is pinned deliberately, for auditability, instead of
        # referencing the `v1.6.1` tag: `v1.6.1` is a lightweight tag that
        # resolves straight to this same commit, so a reviewer can verify the
        # pin, and it changes only through an explicit edit.
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: ${{ matrix.neovim-version }}

      - name: Show the resolved Neovim version
        run: nvim --version | head -n 1

      - name: Install LuaRocks
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes lua5.1 luarocks

      - name: Run tests and generate coverage
        run: make coverage

      - name: Publish coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.neovim-version }}
          path: |
            coverage/index.html
            coverage/summary.out
          if-no-files-found: warn
