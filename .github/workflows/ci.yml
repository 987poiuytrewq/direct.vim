name: CI

# Push covers branches without PRs; pull_request also tests the merge result and
# enables CI for fork PRs. Unfiltered push means tag pushes run too (harmless).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }} (Neovim ${{ matrix.neovim-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      DIRECT_TEST_DIRECTORY_SEPARATOR: slash
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        neovim-version: [v0.12.0, stable]

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Neovim
        # `version: stable` is resolved dynamically at run time, so the exact
        # Neovim build CI exercises can drift without any change to this file.
        # This commit SHA is pinned deliberately, for auditability, instead of
        # referencing the `v1.6.1` tag: `v1.6.1` is a lightweight tag that
        # resolves straight to this same commit, so a reviewer can verify the
        # pin, and it changes only through an explicit edit.
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: ${{ matrix.neovim-version }}

      - name: Show the resolved Neovim version
        run: nvim --version | head -n 1

      - name: Install LuaRocks
        if: runner.os == 'Linux'
        run: make ci-deps

      - name: Run tests and generate coverage
        if: runner.os == 'Linux'
        run: make coverage

      - name: Run tests
        if: runner.os != 'Linux'
        run: nvim --headless -l tests/run.lua

      - name: Add coverage to the run summary
        if: runner.os == 'Linux' && always() && hashFiles('coverage/summary.out') != ''
        run: make coverage-summary NEOVIM_VERSION='${{ matrix.neovim-version }}'

      - name: Publish coverage report
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.neovim-version }}
          path: |
            coverage/index.html
            coverage/summary.out
          if-no-files-found: warn

      - name: Run real-startup smoke test
        run: tests/live_startup.sh
