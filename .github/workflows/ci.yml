name: CI

# Test proposed merge commits for pull requests and the merged default branch.
on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test minimum Neovim on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Neovim
        # Pin the minimum supported version; the Makefile enforces the same floor.
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: v0.12.0

      - name: Install GNU Make on Windows
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MSYS
          install: make
          path-type: inherit

      - name: Run CI
        run: make ci
        env:
          COVERAGE_PLATFORM: ${{ runner.os }}

      - name: Publish coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ runner.os }}
          path: |
            coverage/index.html
            coverage/summary.out
          if-no-files-found: warn

  stable:
    name: Test latest stable Neovim
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install latest stable Neovim
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: stable

      - name: Run CI
        run: make ci
        env:
          COVERAGE_PLATFORM: Linux-stable

      - name: Publish coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-Linux-stable
          path: |
            coverage/index.html
            coverage/summary.out
          if-no-files-found: warn

  nightly:
    name: Test Neovim nightly (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Neovim nightly
        id: setup_nightly
        continue-on-error: true
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: nightly

      - name: Run CI
        id: test_nightly
        continue-on-error: true
        run: make ci
        env:
          COVERAGE_PLATFORM: Linux-nightly

      - name: Report nightly failures without blocking
        if: ${{ steps.setup_nightly.outcome == 'failure' || steps.test_nightly.outcome == 'failure' }}
        run: echo '::warning::Neovim nightly is currently incompatible; this result is informational.'

      - name: Publish coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-Linux-nightly
          path: |
            coverage/index.html
            coverage/summary.out
          if-no-files-found: warn

  demo:
    # Plays the README demo tour without recording it, so a change that breaks
    # the tour fails here instead of the next time the demo is recorded.
    name: Check the demo tour
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Neovim
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: v0.12.0

      - name: Install Expect
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes expect

      - name: Check the demo tour
        run: make demo-check
